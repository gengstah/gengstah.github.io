<body>

    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.6 2.6 0 1 1 4.5 1.8c-1.5 1.2-2 1.5-2 3.2m0 2.4v.5"/></symbol>

  <a class="skip-link" href="#main">Skip to game</a>
  <header class="topbar">
    <div class="header-inner">
      <a class="brand" href="#adventure" aria-label="Wilderkin adventure"><img src="ui/wilderkin.png" alt=""><span>Wilderkin</span></a>
      <nav class="main-nav" aria-label="Game navigation">
        <a href="#adventure" data-view="adventure" aria-current="page"><svg class="icon"><use href="#i-compass"/></svg>Adventure</a>
        <a href="#field-guide" data-view="field-guide"><svg class="icon"><use href="#i-guide"/></svg>Field guide</a>
        <a href="#journal" data-view="journal"><svg class="icon"><use href="#i-journal"/></svg>Journal</a>
      </nav>
      <div class="header-tools">
        <button class="head-tool" id="sound-button" data-action="sound" aria-label="Turn sound off" title="Turn sound off"><svg class="icon"><use href="#i-sound"/></svg></button>
        <button class="head-tool" data-action="help" aria-label="How to play" title="How to play"><svg class="icon"><use href="#i-help"/></svg></button>
      </div>
    </div>
  </header>
  <main id="main" tabindex="-1" class="shell">
    <section id="adventure" aria-labelledby="region-title">
      <div class="page-heading">
        <div>
          <p class="eyebrow"><span class="trail-dot"></span> THE WARDEN TRAIL <span class="slash">/</span> <span id="region-number">REGION 01</span></p>
          <h1 id="region-title">Mossbrook Vale</h1>
          <p id="region-description" class="subtitle">A sleepy woodland village on the banks of the Mossbrook.</p>
        </div>
        <div class="trail-shortcuts"><button class="paper-button" data-action="station"><svg class="icon"><use href="#i-sign"/></svg> Field station</button><button class="paper-button world-button" data-action="world"><svg class="icon"><use href="#i-map"/></svg> World map</button></div>
      </div>
      <div class="dashboard">
        <div class="map-column">
          <section class="game-frame" id="game-frame" aria-label="Overworld">
            <div class="map-stage">
              <canvas id="world-canvas" width="384" height="208" tabindex="0" aria-label="Mossbrook Vale map. Move with arrows or WASD. Press E near a landmark to interact."></canvas>
              <span class="map-label"><i></i> OVERWORLD</span>
              <button class="expand-button" data-action="expand" aria-label="Expand map" title="Expand map"><svg class="icon"><use href="#i-expand"/></svg></button>
              <button id="near-action" class="near-action" data-action="interact" hidden></button>
            </div>
            <div class="map-controls">
              <span class="keyboard-hint"><span class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span> Move</span>
              <button class="keyboard-hint interact-control" data-action="interact"><kbd>E</kbd> Interact</button>
              <span class="touch-hint"><svg class="icon"><use href="#i-click"/></svg> <span id="pointer-hint">Click to move</span></span>
              <button class="mobile-locations" data-action="locations"><svg class="icon"><use href="#i-sign"/></svg> Locations</button>
            </div>
          </section>
          <button class="quest-card" data-action="quest">
            <img class="quest-art" src="ui/quest.png" alt="">
            <span class="quest-text"><span class="eyebrow">CURRENT QUEST</span><strong id="quest-name">Meet Warden Fern</strong><span id="quest-description">Find Warden Fern at Mossbrook Lodge.</span></span>
            <svg class="icon"><use href="#i-chevron"/></svg>
          </button>
        </div>
        <aside class="sidebar" aria-label="Your companions and crests">
          <section class="paper-panel party-panel">
            <div class="panel-heading"><h2><svg class="icon"><use href="#i-party"/></svg>Your party</h2><span class="count" id="party-count">3 / 6</span></div>
            <div id="party-list"></div>
            <a class="guide-link" href="#field-guide">Open field guide <svg class="icon"><use href="#i-arrow"/></svg></a>
          </section>
          <section class="paper-panel crest-panel">
            <div class="panel-heading"><h2><svg class="icon"><use href="#i-crest"/></svg>Trail crests</h2><span class="count" id="crest-count">0 / 30</span></div>
            <div id="crest-list" class="crest-list"></div>
          </section>
        </aside>
      </div>
    </section>
    <section id="field-guide" aria-labelledby="guide-title" hidden></section>
    <section id="journal" aria-labelledby="journal-title" hidden></section>
    <footer class="save-footer"><span><svg class="icon"><use href="#i-save"/></svg><span id="save-status">Progress saved on this device</span></span><button data-action="help">Controls <svg class="icon"><use href="#i-help"/></svg></button></footer>
  </main>
  <dialog id="game-dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="noscript">Enable JavaScript to play Wilderkin.</p></noscript>
</body>
</html>
