<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1c342c">
  <meta name="description" content="Join courier Finch Vale in The Missing Beat, an open-world monster adventure across 150 regions.">
  <title>Wilderkin — The Missing Beat</title>
  <link rel="icon" type="image/png" href="ui/wilderkin.png">
  <link rel="stylesheet" href="canvas.css?v=76241a4c32">
  <script id="play" data-doubles="play-doubles.js?v=548d318180" src="play.js?v=9eec22f429" defer></script>
</head>
<body>
  <section id="launch" aria-labelledby="launch-title">
    <h1 id="launch-title">Wilderkin</h1>
    <p id="launch-status" role="status">Opening your trail…</p>
    <button id="launch-retry" type="button" hidden>Try again</button>
    <noscript>Enable JavaScript to play Wilderkin.</noscript>
  </section>
  <main aria-label="Wilderkin adventure" inert>
    <canvas id="game-canvas" tabindex="0" aria-label="Wilderkin — The Missing Beat">Wilderkin needs a browser with Canvas 2D support.</canvas>
  </main>
  <script>
    (() => {
      const panel = document.getElementById("launch");
      const status = document.getElementById("launch-status");
      const retry = document.getElementById("launch-retry");
      const main = document.querySelector("main");
      const canvas = document.getElementById("game-canvas");
      let downloadFailed = false;
      document.getElementById("play").addEventListener("error", () => { downloadFailed = true; });
      const offerRetry = message => {
        status.textContent = message;
        retry.hidden = false;
      };
      const timer = setTimeout(() => offerRetry("Still opening your trail. You can keep waiting or try again."), 12000);
      retry.addEventListener("click", () => location.reload());
      panel.addEventListener("keydown", event => event.stopPropagation());
      window.WilderLaunch = {
        loadDoubles() {
          return new Promise((resolve, reject) => {
            const script = document.createElement("script");
            script.src = document.getElementById("play").dataset.doubles;
            script.onload = resolve;
            script.onerror = () => { script.remove(); reject(new Error("Doubles could not load")); };
            document.head.append(script);
          });
        },
        ready() {
          clearTimeout(timer);
          main.removeAttribute("inert");
          const moveFocus = panel.contains(document.activeElement);
          panel.hidden = true;
          if (moveFocus) canvas.focus();
        }
      };
      document.addEventListener("DOMContentLoaded", () => {
        if (panel.hidden) return;
        clearTimeout(timer);
        let message = "The game could not finish opening your trail. Try again.";
        if (navigator.onLine === false) message = "Your trail could not open while offline. Reconnect and try again.";
        else if (downloadFailed) message = "The game files could not download. Check your connection and try again.";
        else {
          try {
            if (!canvas.getContext("2d")) message = "Wilderkin needs Canvas 2D. Enable it or open the game in another browser.";
          } catch { message = "Wilderkin needs a browser with Canvas 2D support."; }
        }
        offerRetry(message);
      });
    })();
  </script>
</body>
</html>
